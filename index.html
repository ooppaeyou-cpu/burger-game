<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Burger Rush v9.2.1</title>

<link rel="stylesheet" href="style.css">

</head>


<body>



<!-- START SCREEN -->

<div id="startScreen">


<h1>🍔 Burger Rush</h1>

<h2>v9.2.1 Final Clean</h2>


<button onclick="startGame()">
▶ START GAME
</button>


</div>








<!-- LEVEL POPUP -->


<div id="popup">


<h1 id="popupTitle">
</h1>


<div id="popupText">
</div>


<button onclick="closePopup()">
ไปต่อ
</button>


</div>










<!-- GAME -->


<div id="game">



<h1>
🍔 Burger Rush
</h1>







<!-- TOP INFO -->


<div class="top">


<div>
ด่าน:
<span id="level">1</span>
</div>



<div>
💰
<span id="money">0</span>
</div>



<div>
⭐
<span id="score">0</span>
</div>



</div>








<!-- STOCK -->


<div id="stock">


<h2>
📦 STOCK
</h2>


🍖 เนื้อ :
<span id="meatStock">0</span>

<br>


🍟 เฟรน :
<span id="friesStock">0</span>

<br>


🥤 น้ำ :
<span id="drinkStock">0</span>

<br>


🍔 เบอร์เกอร์ :
<span id="burgerStock">0</span>



</div>









<!-- MISSION -->


<div id="mission">


<h2>
📋 ภารกิจ
</h2>


<div id="missionText">

</div>


</div>









<!-- CUSTOMER -->


<h2>
👥 ลูกค้า
</h2>


<div id="customers">

</div>



<h3 id="selected">

ยังไม่ได้เลือกลูกค้า

</h3>









<!-- KITCHEN -->


<div class="kitchen">







<!-- MEAT -->

<div class="station">


<h2>
🥩 ทอดเนื้อ
</h2>


<div class="circle">

<div id="meatTimer">
0%
</div>


</div>



<button onclick="cookMeat()">
ทอดเนื้อ
</button>



<button onclick="throwMeat()">
🗑 ทิ้ง
</button>



<div id="meatStatus">
ว่าง
</div>


</div>









<!-- FRIES -->


<div class="station">


<h2>
🍟 ทอดเฟรน
</h2>


<div class="circle">

<div id="friesTimer">
0%
</div>

</div>



<button onclick="cookFries()">
ทอดเฟรน
</button>



<button onclick="throwFries()">
🗑 ทิ้ง
</button>



<div id="friesStatus">
ว่าง
</div>


</div>









<!-- DRINK -->


<div class="station">


<h2>
🥤 น้ำปั่น
</h2>



<div class="circle">


<div id="drinkTimer">
0%
</div>


</div>




<button onclick="makeDrink()">

ปั่นน้ำ

</button>



<button onclick="throwDrink()">

🗑 ทิ้ง

</button>



<div id="drinkStatus">

ว่าง

</div>


</div>









<!-- BURGER ASSEMBLE -->


<div class="station">


<h2>
🍔 ประกอบ
</h2>



<div id="burgerStatus">

ยังไม่ได้ทำ

</div>




<button onclick="makeBurger()">

ประกอบเบอร์เกอร์

</button>



</div>








</div>









<!-- SERVE -->


<br>


<button class="serve"
onclick="serveCustomer()">

🚗 เสิร์ฟลูกค้า

</button>






<h2 id="message">

</h2>







</div>








<script src="game.js"></script>


</body>


</html>
