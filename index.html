<!DOCTYPE html>
<html>

<head>

<title>Burger Rush v8.1</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<audio id="bgm" loop>
<source src="sounds/bgm.mp3">
</audio>

<audio id="clickSound">
<source src="sounds/click.mp3">
</audio>

<audio id="successSound">
<source src="sounds/success.mp3">
</audio>

<audio id="failSound">
<source src="sounds/fail.mp3">
</audio>





<!-- START -->

<div id="startScreen">


<h1>
🍔 Burger Rush v8.1
</h1>


<h2>
ร้านเบอร์เกอร์สุดป่วน
</h2>


<button onclick="startGame()">

▶ START

</button>


</div>









<!-- ผ่านด่าน -->


<div id="levelPopup">


<h1>
🎉 ผ่านด่าน
</h1>


<div id="popupText">

</div>


<button onclick="nextLevel()">

ด่านต่อไป

</button>


</div>









<div id="game">


<h1>
🍔 Burger Rush
</h1>




<div class="top">


<div>
🏆 ด่าน
<span id="level">
1
</span>
</div>


<div>
💰
<span id="money">
0
</span>
</div>


<div>
⭐
<span id="score">
0
</span>
</div>


<div>
👥 เสิร์ฟ
<span id="served">
0
</span>
</div>


</div>







<!-- ภารกิจ -->


<div id="missionBox">


<h2>
📋 ภารกิจ
</h2>


<div id="missionText">

เริ่มเกมเพื่อดูภารกิจ

</div>


</div>








<!-- ลูกค้า -->


<h2>
👥 ลูกค้าในร้าน
</h2>


<div id="customers">


</div>





<h3 id="selectedCustomer">

เลือกลูกค้าเพื่อเสิร์ฟ

</h3>









<!-- ครัว -->


<div class="kitchen">







<!-- เนื้อ -->

<div class="station">


<h2>
🔥 เนื้อ
</h2>


<div id="meat"
class="food">

🥩

</div>



<div class="circle">

<div id="meatProgress">
0%
</div>

</div>



<p id="meatStatus">

</p>


<button onclick="cookMeat()">

ทอดเนื้อ

</button>


<button onclick="throwMeat()">

ทิ้ง

</button>


</div>









<!-- เฟรน -->

<div class="station">


<h2>
🍟 เฟรน
</h2>


<div id="fries"
class="food">

🥔

</div>



<div class="circle">

<div id="friesProgress">
0%
</div>

</div>



<p id="friesStatus">

</p>


<button onclick="cookFries()">

ทอดเฟรน

</button>


<button onclick="throwFries()">

ทิ้ง

</button>


</div>









<!-- น้ำ -->

<div class="station">


<h2>
🥤 น้ำปั่น
</h2>


<div id="drink"
class="food">

🍓

</div>



<div class="circle">

<div id="drinkProgress">
0%
</div>

</div>



<p id="drinkStatus">

</p>


<button onclick="blendDrink()">

ปั่นน้ำ

</button>


<button onclick="throwDrink()">

ทิ้ง

</button>


</div>









<!-- ประกอบ -->


<div class="station">


<h2>
🍔 ประกอบ
</h2>


<div id="burger"
class="food">

🍞

</div>




<div id="assembleText">

ยังไม่ได้ประกอบ

</div>


<div id="assembleBar">

<div id="assembleProgress">

</div>

</div>



<button onclick="makeBurger()">

ประกอบ

</button>


</div>






</div>









<button class="serve"
onclick="serveCustomer()">

🚗 เสิร์ฟลูกค้าที่เลือก

</button>




<h2 id="message">

</h2>




</div>








<script src="game.js"></script>


</body>


</html>
