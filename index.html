<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Burger Rush v9.0</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- START -->

<div id="startScreen">

<h1>🍔 Burger Rush</h1>

<h2>Cooking Game v9.0</h2>

<button onclick="startGame()">
▶ START
</button>

</div>





<!-- LEVEL POPUP -->

<div id="levelPopup">

<h1>🎉 ผ่านด่าน</h1>

<div id="popupText"></div>

<button onclick="nextLevel()">
ด่านต่อไป
</button>

</div>






<!-- GAME -->

<div id="game" style="display:none;">


<h1>
🍔 Burger Rush
</h1>



<div class="top">


<div>
🏆 ด่าน
<span id="level">1</span>
</div>


<div>
💰
<span id="money">0</span>
</div>


<div>
⭐
<span id="score">0</span>
</div>


<div>
👥
<span id="served">0</span>
</div>


</div>







<!-- STOCK -->

<div id="stockBox">

🍖 เนื้อ : 0

<br>

🍟 เฟรน : 0

<br>

🥤 น้ำ : 0

<br>

🍔 เบอร์เกอร์ : 0

</div>








<!-- MISSION -->


<div id="missionBox">

<h2>
📋 ภารกิจ
</h2>


<div id="missionText">

</div>


</div>







<!-- CUSTOMERS -->


<h2>
👥 ลูกค้า
</h2>


<div id="customers">

</div>



<h3 id="selectedCustomer">

ยังไม่ได้เลือกลูกค้า

</h3>







<!-- KITCHEN -->

<div class="kitchen">






<!-- MEAT -->

<div class="station">


<h2>
🔥 ทอดเนื้อ
</h2>


<div class="food">
🥩
</div>


<div class="circle">

<div id="meatTime">
0%
</div>

</div>


<button onclick="cookMeat()">

ทอด

</button>



<button onclick="throwMeat()">

ทิ้ง

</button>



</div>








<!-- FRIES -->

<div class="station">


<h2>
🍟 ทอดเฟรน
</h2>


<div class="food">
🍟
</div>


<div class="circle">

<div id="friesTime">
0%
</div>

</div>



<button onclick="cookFries()">

ทอด

</button>



<button onclick="throwFries()">

ทิ้ง

</button>



</div>








<!-- DRINK -->


<div class="station">


<h2>
🥤 น้ำปั่น
</h2>


<div class="food">
🥤
</div>


<div class="circle">

<div id="drinkTime">
0%
</div>

</div>


<button onclick="makeDrink()">

ปั่น

</button>



<button onclick="throwDrink()">

ทิ้ง

</button>


</div>








<!-- BURGER -->


<div class="station">


<h2>
🍔 ประกอบ
</h2>


<div class="food">
🍔
</div>


<div id="burgerText">

ยังไม่ได้ประกอบ

</div>



<button onclick="makeBurger()">

ประกอบ

</button>


</div>






</div>








<button class="serve"
onclick="serveCustomer()">

🚗 เสิร์ฟ

</button>





<h2 id="message">

</h2>




</div>








<script src="game.js"></script>


</body>

</html>
